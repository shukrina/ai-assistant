[project]
name = "ai-assistant"
version = "1.0.0"
description = "RAG-powered AI assistant with tool calling, caching, retries, and provider fallback"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "sqlalchemy==2.0.35",
    "openai==1.51.0",
    "anthropic==0.36.0",
    "google-generativeai==0.8.2",
    "tenacity==9.0.0",
    "slowapi==0.1.9",
    "chromadb==0.5.11",
    "sentence-transformers==3.1.1",
    "streamlit==1.39.0",
    "requests==2.32.3",
    "python-multipart==0.0.12",
    "python-dotenv==1.0.1",
]

[dependency-groups]
dev = [
    "pytest==8.3.3",
    "httpx==0.27.2",
]

[tool.uv]
package = false
