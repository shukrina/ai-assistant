name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # This will generate a lockfile on the fly if it is missing
        run: uv sync --dev

      - name: Run tests
        # Create data dir and set PYTHONPATH so 'app' is findable
        run: |
          mkdir -p data/chroma
          PYTHONPATH=. uv run pytest tests/

  build-docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false 
          tags: ai-assistant-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
